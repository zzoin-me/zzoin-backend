# Server
server.port=3300
server.forward-headers-strategy=framework

# Application
spring.application.name=projectfinder
app.time-zone=Asia/Seoul
spring.jackson.time-zone=Asia/Seoul

# Database (MySQL)
# 백엔드에서 사용할 MySql 서버에 연결합니다
spring.datasource.url=jdbc:mysql://localhost:3306/projectfinder
spring.datasource.username=your_db_user
spring.datasource.password=your_db_password
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.threadPool.threadCount=3

# SMTP (Gmail)
# Gmail 계정에서 2차 인증 후 앱 비밀번호를 발급받아 사용합니다
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_gmail@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# JWT
jwt.secret=your_256bit_secret_key_base64_encoded

# OAuth2 - Google
# Google API Console에서 새 앱 생성 후 client id 및 secret을 발급받아 사용합니다
spring.security.oauth2.client.registration.google.client-id=your_google_client_id
spring.security.oauth2.client.registration.google.client-secret=your_google_client_secret
spring.security.oauth2.client.registration.google.scope=email,profile

# OAuth2 - Kakao
# 카카오 Developers에서 새 앱 생성 후 client id, secret을 발급받아 사용합니다
# 비즈니스 앱을 전환 후 scope에서 이메일을 필수 항목으로 활성화해야 사용 가능합니다
spring.security.oauth2.client.registration.kakao.client-id=your_kakao_rest_api_key
spring.security.oauth2.client.registration.kakao.client-secret=your_kakao_client_secret
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=account_email,profile_nickname
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://oauth2.kakao.com/oauth2/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# OAuth2 - Redirect Base
app.oauth2.front-redirect-base=http://localhost:5173

# Firebase
# firebase에서 새 프로젝트 생성 후 iOS, Android를 추가 후 계정인증 json 파일을 받아 프로젝트 루트에 위치시킵니다
firebase.service-account-path=/home/ubuntu/zzoin-backend/firebase-service-account.json

# Cloudflare R2
# Cloudflare R2에서 새 프로젝트 생성 후 account id, 프로젝트 access key id 및 secret access key를 발급받아 사용합니다
cloudflare.r2.enabled=false
cloudflare.r2.account-id=your_cloudflare_account_id
cloudflare.r2.access-key-id=your_r2_access_key_id
cloudflare.r2.secret-access-key=your_r2_secret_access_key
cloudflare.r2.bucket-name=your_r2_bucket_name
cloudflare.r2.public-base-url=https://cdn.example.com
cloudflare.r2.object-prefix=posts
cloudflare.r2.max-image-size-bytes=5242880
cloudflare.r2.max-images-per-request=10

# Multipart limit upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB
